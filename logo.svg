<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="אבי אלחרר — מורה נהיגה">
  <defs>
    <!-- Gold rim: bright at the top-left, deep bronze at the bottom-right, so the
         disc reads as a lit metal object rather than a flat circle. -->
    <linearGradient id="rim" x1="18" y1="10" x2="100" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff6da"/>
      <stop offset=".28" stop-color="#f4d03f"/>
      <stop offset=".62" stop-color="#c9992a"/>
      <stop offset="1" stop-color="#7d5c17"/>
    </linearGradient>
    <radialGradient id="well" cx="38%" cy="30%" r="82%">
      <stop offset="0" stop-color="#241d12"/>
      <stop offset=".55" stop-color="#120f09"/>
      <stop offset="1" stop-color="#070603"/>
    </radialGradient>
    <linearGradient id="wheel" x1="30" y1="26" x2="92" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffaeb"/>
      <stop offset=".45" stop-color="#f4d03f"/>
      <stop offset="1" stop-color="#b89822"/>
    </linearGradient>
    <linearGradient id="road" x1="60" y1="96" x2="60" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4d03f" stop-opacity=".85"/>
      <stop offset="1" stop-color="#f4d03f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="34" y1="14" x2="70" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="60" cy="60" r="52"/></clipPath>
  </defs>

  <circle cx="60" cy="60" r="57" fill="url(#rim)"/>
  <circle cx="60" cy="60" r="52" fill="url(#well)"/>

  <!-- A short stretch of road under the hub. Kept narrow and low: at 52px in the
       header anything wider collapses into a smudge. -->
  <g clip-path="url(#disc)" opacity=".7">
    <path d="M60 74 L74 106 L46 106 Z" fill="url(#road)"/>
    <path d="M60 82 v5 M60 94 v7" stroke="#0d0b06" stroke-width="2.6" stroke-linecap="round" opacity=".8"/>
  </g>

  <g fill="none" stroke="url(#wheel)" stroke-linecap="round">
    <circle cx="60" cy="60" r="33" stroke-width="7"/>
    <path d="M27.4 57.5 H92.6" stroke-width="6"/>
    <path d="M60 66 V93" stroke-width="6"/>
  </g>
  <circle cx="60" cy="60" r="9.5" fill="url(#wheel)"/>
  <circle cx="60" cy="60" r="4.4" fill="#100d08"/>

  <path d="M60 3a57 57 0 0 0-49.3 85.2A57 57 0 0 1 88.2 10.7 56.8 56.8 0 0 0 60 3Z" fill="url(#gloss)"/>
</svg>
